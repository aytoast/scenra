name: Publish Scenra
on:
  push:
    branches: [main]
    paths: ['app/**', 'worlds/**', 'submission/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /scenra/studio/
      - name: Assemble website and studio
        run: |
          mkdir -p _site/studio
          cp -a submission/. _site/
          cp -a app/dist/. _site/studio/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Reject stale Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scenra_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$scenra_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot verify latest main commit SHA. Pages deployment stopped."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$scenra_main_sha" ]]; then
            echo "::error::Stale Pages build: checkout $GITHUB_SHA differs from latest main $scenra_main_sha. Run Pages workflow on latest main to publish website and studio together."
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
